[project]
name = "gridworld-starter"
version = "0.1.0"
description = "S0: first MVC game, terminal rendering and supplied Pygame components"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1,<4",
    "pygame-ce>=2.5.8,<3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

# Copy these sections into pyproject.toml; keep its other sections.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F821", "F401", "F841"]